# Terminal capabilities.

# What programs inside tmux see as $TERM.
# (Remote hosts over ssh need the tmux-256color terminfo; if one lacks it,
#  run `TERM=xterm-256color ssh ...` for that host.)
set -g default-terminal "tmux-256color"

# Reset array options so reloading this file does not duplicate entries.
set -su terminal-features
set -su terminal-overrides

# Features of the OUTER terminal, matched against the client's TERM.
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB:extkeys,alacritty:RGB,xterm-ghostty:RGB"
set -as terminal-features ",*:clipboard"

# Undercurl and coloured underlines.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Extended (CSI-u) keys.
set -s extended-keys on
set -s extended-keys-format csi-u

# Clipboard via OSC 52; the copy-command fallback lives in linux.conf.
set -s set-clipboard on

# Lets programs send escape sequences straight to the outer terminal
# (kitty graphics, notifications). Any pane can do this — trade-off accepted.
set -g allow-passthrough on

set -g focus-events on

# Terminal title follows the active pane title.
set -g set-titles on
set -g set-titles-string "#T"
