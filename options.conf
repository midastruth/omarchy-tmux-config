# General behaviour.

set -g prefix C-Space
# Key repetition is disabled, so `bind -r` has no effect anywhere.
set -g repeat-time 0
set -s escape-time 10

set -g mouse on
setw -g mode-keys vi
set -g history-limit 65536

# Windows start at 0 (M-0 is the first window); panes start at 1.
set -g base-index 0
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
