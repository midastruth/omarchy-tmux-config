#### COLOUR (Dracula)
# default statusbar colors
set-option -g status-style bg=terminal,fg=#f8f8f2,default
# default window title colors
set-window-option -g window-status-style fg=#6272a4,bg=terminal,dim
# active window title colors
set-window-option -g window-status-current-style fg=#f8f8f2,bg=terminal,bright
# pane border
set-option -g pane-border-style fg=#6272a4
set-option -g pane-active-border-style fg=#f8f8f2
# message text
set-option -g message-style bg=#44475a,fg=#f8f8f2
# pane number display
set-option -g display-panes-active-colour colour81 #cyan
set-option -g display-panes-colour colour212 #pink
# clock
set-window-option -g clock-mode-colour colour84 #green

