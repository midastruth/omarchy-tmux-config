# Omarchy terminal palette
#   colour0  background       colour8  muted
#   colour1  red              colour9  bright red
#   colour2  green            colour10 bright green
#   colour3  yellow           colour11 bright yellow
#   colour4  accent/blue      colour12 bright blue
#   colour5  magenta          colour13 bright magenta
#   colour6  cyan             colour14 bright cyan
#   colour7  foreground       colour15 bright foreground
# Omarchy regenerates these ANSI slots whenever its theme changes.

# Pane contents and cursor
setw -g window-style "fg=terminal,bg=terminal"
setw -g window-active-style "fg=terminal,bg=terminal"
set -g cursor-colour colour15
set -g pane-border-style "fg=colour8,bg=terminal"
set -g pane-active-border-style "fg=colour4,bg=terminal"
set -g pane-scrollbars-style "fg=colour8,bg=colour0,width=1,pad=0"

# Copy mode
setw -g mode-style "fg=colour0,bg=colour4"
setw -g copy-mode-line-number-style "fg=colour8"
setw -g copy-mode-current-line-number-style "fg=colour3,bold"
setw -g copy-mode-match-style "fg=colour0,bg=colour6"
setw -g copy-mode-current-match-style "fg=colour0,bg=colour5,bold"
setw -g copy-mode-mark-style "fg=colour0,bg=colour1"

# Messages, command prompt, menus and popups
set -g message-style "fg=colour0,bg=colour4"
set -g message-command-style "fg=colour0,bg=colour4"
set -g menu-style "fg=colour7,bg=colour0"
set -g menu-selected-style "fg=colour0,bg=colour4,bold"
set -g menu-border-style "fg=colour8,bg=colour0"
set -g popup-style "fg=colour7,bg=colour0"
set -g popup-border-style "fg=colour4,bg=colour0"

# Pane numbers and clock
set -g display-panes-colour colour8
set -g display-panes-active-colour colour4
setw -g clock-mode-colour colour4

# Base status styles; statusline.conf supplies the Powerline segments.
set -g status-style "fg=colour8,bg=terminal"
setw -g window-status-style "fg=colour8,bg=terminal"
setw -g window-status-current-style "fg=colour7,bg=terminal,bold"
setw -g window-status-activity-style "underscore,fg=colour4,bg=terminal"
setw -g window-status-bell-style "fg=colour0,bg=colour1,bold"

