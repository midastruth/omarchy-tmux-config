# vim: ft=tmux
set -g mode-style "fg=#eee8d5,bg=#073642"

set -g message-style "fg=#eee8d5,bg=#073642"
set -g message-command-style "fg=#eee8d5,bg=#073642"

set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#eee8d5"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#586e75,bg=terminal"

set -g status-bg "terminal"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#073642,bg=#eee8d5,bold] #S:#I.#P #[fg=#eee8d5,bg=#93a1a1,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #(whoami) #[fg=#93a1a1,bg=terminal]"
set -g status-right "#[fg=#586e75,bg=terminal,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#586e75]#[fg=#657b83,bg=#586e75,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#657b83]#[fg=#93a1a1,bg=#657b83,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold]#{?#{m:agent-*,#{session_name}},,#[range=user|agent_launch]  #[norange]丨} #[range=user|agent_list]#{?@agent_status_cache,#{@agent_status_cache},#h}#[norange] #{?#{m:agent-*,#{session_name}},丨#[range=user|agent_detach]   #[norange],}"

setw -g window-status-activity-style "underscore,fg=#839496,bg=terminal"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#839496,bg=terminal"
setw -g window-status-format '#[fg=colour0,bg=terminal]#[default] #I  #{b:pane_current_path} #[bg=terminal,nobold,nounderscore,noitalics] '
setw -g window-status-current-format '#[fg=#eee8d5,bg=terminal,reverse]#[noreverse,fg=#b58900,bg=#eee8d5] #I #[fg=#eee8d5,bg=#b58900] #{b:pane_current_path} #[fg=#b58900,bg=terminal,nobold]'

