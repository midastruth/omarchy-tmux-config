# vim: ft=tmux
# Colours come from Omarchy's ANSI terminal palette; see theme.conf.

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=colour8,bg=terminal"

set -g status-bg "terminal"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=colour0,bg=colour7,bold] #S:#I.#P #[fg=colour7,bg=colour8,nobold,nounderscore,noitalics]#[fg=colour7,bg=colour8,bold] #(whoami) #[fg=colour8,bg=terminal]"
set -g status-right "#[fg=colour8,bg=terminal,nobold,nounderscore,noitalics]#[fg=colour7,bg=colour8]#[fg=colour15,bg=colour7]#[fg=colour0,bg=colour15,bold]#{?#{m:agent-*,#{session_name}},,#[range=user|agent_launch]  #[norange]丨} #[range=user|agent_list]#{?@agent_status_cache,#{@agent_status_cache},#h}#[norange] #{?#{m:agent-*,#{session_name}},丨#[range=user|agent_detach]   #[norange],}"

setw -g window-status-separator ""
setw -g window-status-format '#[fg=colour0,bg=terminal]#[fg=colour8,bg=terminal] #I  #{b:pane_current_path} #[nobold,nounderscore,noitalics] '
setw -g window-status-current-format '#[fg=colour4,bg=terminal,reverse]#[noreverse,fg=colour0,bg=colour4,bold] #I #[fg=colour4,bg=colour3,nobold]#[fg=colour0,bg=colour3] #{b:pane_current_path} #[fg=colour3,bg=terminal]'
