# Click the session name to cycle sessions; click the username to create a window.
# set -g status-left "#[fg=colour0,bg=colour7,bold] #[range=user|session_cycle]#S#[norange]:#I.#P #[fg=colour7,bg=colour8,nobold,nounderscore,noitalics]#[fg=colour7,bg=colour8,bold] #[range=user|window_new]#(whoami)#[norange] #[fg=colour8,bg=terminal]"


# Status-line mouse actions.
# Keep tmux-argos actions and normal window clicks working.
bind -N "Handle status-line click" -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},session_cycle}' {
  switch-client -n
} {
  if-shell -F '#{==:#{mouse_status_range},window_new}' {
    new-window -c "#{pane_current_path}"
  } {
    if-shell -F '#{||:#{==:#{mouse_status_range},agent_detach},#{||:#{==:#{mouse_status_range},agent_list},#{==:#{mouse_status_range},agent_launch}}}' {
      run-shell "~/.config/tmux/plugins/tmux-argos/scripts/status_click.sh '#{mouse_status_range}' '#{client_name}' '#{pane_current_path}' '#{window_id}'"
    } {
      switch-client -t =
    }
  }
}
