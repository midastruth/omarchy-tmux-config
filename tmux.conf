# tmux entry point: load order only.
#
# Rule: every option / binding is set in exactly ONE file.
#   terminal.conf   outer-terminal capabilities (TERM, features, clipboard)
#   options.conf    general behaviour (prefix, history, mouse, indexing)
#   theme.conf      all colours and styles (Omarchy ANSI palette)
#   statusline.conf status-line content / formats
#   plugins         TPM (declared here so TPM can parse @plugin lines)
#   keyboard.conf   all key and mouse bindings; loaded last so it wins
#                   over plugin defaults — overrides are noted inline.

source-file ~/.config/tmux/terminal.conf
if-shell "uname -s | grep -q Linux" "source-file ~/.config/tmux/linux.conf"
source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/statusline.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'midastruth/tmux-argos'
# NOTE: TPM clean (prefix M-u) rm -rf's every directory under plugins/ that is
# not declared above. Never keep non-plugin files there.
run '~/.config/tmux/plugins/tpm/tpm'

source-file ~/.config/tmux/keyboard.conf
